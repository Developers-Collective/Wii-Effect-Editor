name: Build and rolling release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  STAGING_TAG: ci-staging-${{ github.run_id }}-${{ github.run_attempt }}

# Finish a release before starting the next one on the same branch.
concurrency:
  group: effect-editor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref_name != github.event.repository.default_branch
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux-x64
          - os: macos-26
            platform: macOS-arm64
          - os: windows-2022
            platform: Windows-x64
    uses: ./.github/workflows/build-platform.yml
    with:
      runner: ${{ matrix.os }}
      platform: ${{ matrix.platform }}

  prepare_release:
    if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create temporary draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$STAGING_TAG" --draft --target "$GITHUB_SHA" \
            --title 'Temporary CI packages' --notes 'Removed after this workflow completes.'

  release_build:
    needs: prepare_release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: Linux-x64
          - os: macos-26
            platform: macOS-arm64
          - os: windows-2022
            platform: Windows-x64
    uses: ./.github/workflows/build-platform.yml
    with:
      runner: ${{ matrix.os }}
      platform: ${{ matrix.platform }}
      stage_release: true
      staging_tag: ci-staging-${{ github.run_id }}-${{ github.run_attempt }}

  release:
    needs: release_build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify staged packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$STAGING_TAG" --pattern 'Wii-Effect-Editor-*.zip' --dir artifacts
          for platform in Linux-x64 macOS-arm64 Windows-x64; do
            test -s "artifacts/Wii-Effect-Editor-$platform.zip"
          done
      - name: Update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f rolling "$GITHUB_SHA"
          git push origin refs/tags/rolling --force
          printf 'Automatic builds from commit `%s`.\n\nWindows x64, Linux x64 (Ubuntu 24.04 or newer), and macOS Apple Silicon.\n' "$GITHUB_SHA" > release-notes.md
          if gh release view rolling >/dev/null 2>&1; then
            gh release upload rolling artifacts/*.zip --clobber
            gh release edit rolling --title 'Effect Editor - latest build' --notes-file release-notes.md --latest
          else
            gh release create rolling artifacts/*.zip --verify-tag --title 'Effect Editor - latest build' --notes-file release-notes.md --latest
          fi

  cleanup:
    needs: [prepare_release, release_build, release]
    if: always() && needs.prepare_release.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Remove temporary draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release delete "$STAGING_TAG" --yes
